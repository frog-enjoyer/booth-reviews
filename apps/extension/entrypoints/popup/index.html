<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booth Reviews</title>
    <script type="module" src="./main.ts"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        width: 300px;
        background: #f6f8fa;
        color: #1f2328;
      }

      .popup-header {
        background: #1a1a2e;
        color: white;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .popup-logo {
        width: 32px;
        height: 32px;
        background: #e8404f;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        flex-shrink: 0;
      }

      .popup-title {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .popup-subtitle {
        font-size: 11px;
        color: #8b949e;
        margin-top: 1px;
      }

      .popup-body {
        padding: 14px;
      }

      .status-card {
        background: white;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .status-avatar {
        width: 36px;
        height: 36px;
        background: #e9ecef;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
      }

      .status-name {
        font-size: 14px;
        font-weight: 600;
        color: #1f2328;
      }

      .status-text {
        font-size: 12px;
        color: #57606a;
        margin-top: 2px;
      }

      .status-hint {
        font-size: 12px;
        color: #57606a;
      }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 9px 16px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        font-family: inherit;
      }

      .btn:hover { filter: brightness(0.93); }
      .btn:active { filter: brightness(0.86); }

      .btn-discord {
        background: #5865f2;
        color: white;
      }

      .btn-logout {
        background: white;
        border: 1px solid #d0d7de;
        color: #57606a;
        font-size: 13px;
        padding: 7px 12px;
        margin-top: 6px;
      }

      .error-msg {
        font-size: 12px;
        color: #cf222e;
        margin-top: 8px;
        text-align: center;
        min-height: 16px;
      }

      .hidden { display: none !important; }

      .loading-text {
        font-size: 13px;
        color: #6e7781;
        padding: 14px 0 6px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header class="popup-header">
      <div class="popup-logo">⭐</div>
      <div>
        <div class="popup-title">Booth Reviews</div>
        <div class="popup-subtitle">Community ratings for Booth.pm</div>
      </div>
    </header>

    <div class="popup-body">

      <div id="state-loading">
        <p class="loading-text">Checking session…</p>
      </div>

      <div id="state-signed-in" class="hidden">
        <div class="status-card">
          <div class="status-avatar">👤</div>
          <div>
            <div class="status-name" id="user-name"></div>
            <div class="status-text">Signed in via Discord</div>
          </div>
        </div>
        <button id="logout" class="btn btn-logout" type="button">Sign out</button>
      </div>

      <div id="state-signed-out" class="hidden">
        <div class="status-card">
          <div class="status-avatar">👤</div>
          <div class="status-hint">Sign in to leave reviews on Booth listings.</div>
        </div>
        <button id="login" class="btn btn-discord" type="button">
          <svg width="18" height="14" viewBox="0 0 71 55" fill="white" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M60.1 4.9A58.6 58.6 0 0045.8.5c-.6 1.1-1.4 2.7-1.9 3.9a54.2 54.2 0 00-16.3 0C27.1 3.2 26.3 1.6 25.7.5A58.4 58.4 0 0011.9 4.9C1.7 20.1-1 35 .3 49.7A59 59 0 0018 54.8c1.5-2 2.8-4.2 3.9-6.5-2.1-.8-4.2-1.8-6.1-3l1.5-1.2a42.2 42.2 0 0036.3 0l1.5 1.2c-2 1.2-4 2.2-6.2 3 1.1 2.3 2.4 4.5 3.9 6.5A58.8 58.8 0 0070.7 49.7C72.3 32.7 67.8 18 60.1 4.9zM23.7 40.7c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.5 0 6.4 3.2 6.4 7.2s-2.9 7.2-6.4 7.2zm23.6 0c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.5 0 6.4 3.2 6.4 7.2s-2.9 7.2-6.4 7.2z"/>
          </svg>
          Sign in with Discord
        </button>
      </div>

      <p id="login-error" class="error-msg"></p>

    </div>
  </body>
</html>
